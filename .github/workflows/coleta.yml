# Central de vendas na nuvem (GitHub Actions). Enviado para .github/workflows/coleta.yml pelo nuvem.ps1.
# Codigo, config e cache do Tiny ficam criptografados no release "nuvem" (codigo.enc e estado.enc).
# A cada 15 min: sincroniza com o Tiny por 10 min, salva o cache e publica o link.
name: Coleta do painel

on:
  schedule:
    # minutos "quebrados": no :00/:15 o GitHub fica sobrecarregado e atrasa ou pula rodadas
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CHAVE_NUVEM: ${{ secrets.CHAVE_NUVEM }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - name: Fuso de Brasilia
        run: tzutil /s "E. South America Standard Time"

      - name: Abrir pacotes
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          gh release download nuvem -p codigo.enc -D pacotes -R $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Nao baixei o codigo.enc do release nuvem.' }
          .github\cripto.ps1 abrir pacotes\codigo.enc app
          # estado.enc; se um envio parou no meio, o novo-estado.enc; sem nenhum, comeca com o cache vazio
          $rel = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/nuvem" | ConvertFrom-Json
          $estado = @('estado.enc', 'novo-estado.enc' | Where-Object { @($rel.assets.name) -contains $_ })[0]
          if ($estado) {
            gh release download nuvem -p $estado -D pacotes -R $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Nao baixei o $estado do release nuvem." }
            .github\cripto.ps1 abrir "pacotes\$estado" app
          } else {
            Write-Host '::warning::O release nuvem esta sem estado.enc: a coleta comeca com o cache vazio.'
          }

      - name: Sincronizar com o Tiny
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File app\painel-empresa\painel.ps1 -Nuvem -Minutos 10

      - name: Salvar cache
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          New-Item -ItemType Directory -Force estado\painel-empresa\cache | Out-Null
          Copy-Item app\painel-empresa\cache\pedidos.jsonl, app\painel-empresa\cache\produtos.jsonl estado\painel-empresa\cache\
          .github\cripto.ps1 fechar estado pacotes\novo-estado.enc
          # envia com nome provisorio e so depois troca (como o Send-Pacote do nuvem.ps1):
          # o --clobber apagava o estado.enc antes de enviar, e um envio que falhasse deixava o release sem ele
          $api = "repos/$env:GITHUB_REPOSITORY/releases"
          $rel = gh api "$api/tags/nuvem" | ConvertFrom-Json
          foreach ($a in @($rel.assets | Where-Object { $_.name -eq 'novo-estado.enc' })) { gh api -X DELETE "$api/assets/$($a.id)" }
          gh release upload nuvem pacotes\novo-estado.enc -R $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao enviar o novo-estado.enc (o estado.enc anterior continua no release).' }
          foreach ($a in @($rel.assets | Where-Object { $_.name -eq 'estado.enc' })) { gh api -X DELETE "$api/assets/$($a.id)" }
          $novo = @((gh api "$api/tags/nuvem" | ConvertFrom-Json).assets | Where-Object { $_.name -eq 'novo-estado.enc' })[0]
          gh api -X PATCH "$api/assets/$($novo.id)" -f name=estado.enc | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao renomear novo-estado.enc para estado.enc (a proxima coleta usa o novo-estado.enc).' }

      - name: Manter o agendamento ligado
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/coleta.yml/enable"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: app/site
          retention-days: 1

  publicar:
    needs: coleta
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v4
